[project]
name = "plateaunavigator"
version = "0.1.0"
description = "VQA Benchmarking Framework — CV vs DV variational algorithms"
requires-python = ">=3.11"

dependencies = [
    # --- Quantum Core ---
    "pennylane>=0.38.0",
    "pennylane-lightning>=0.38.0",
    "qiskit>=1.0.0",
    "qiskit-aer>=0.14.0",
    "qiskit-ibm-runtime>=0.20.0",
    "mrmustard>=0.7.0",
    "xanadu-cloud-client>=0.3.0",

    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "websockets>=12.0",

    "celery>=5.4.0",
    "redis>=5.0.0",

    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "matplotlib>=3.9.0",

    "httpx>=0.27.0",

    "dependency-injector>=4.41.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
asyncio_mode = "strict"
